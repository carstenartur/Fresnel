version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-and-patch:
        update-types:
          - minor
          - patch

  # Dependabot preserves immutable commit-SHA references while updating the
  # semantic version comments kept beside each action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - '*'

  # Update the tag and sha256 digest together for every Dockerfile base image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-base-images:
        patterns:
          - '*'
