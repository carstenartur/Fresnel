name: Probe Fresnel 0.1.7 package status

on:
  push:
    branches:
      - automation/release-status-0.1.7
    paths:
      - .github/workflows/check-release-0.1.7.yml

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture manual package runs and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PACKAGE_RUNS=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow release-package.yml \
            --event workflow_dispatch \
            --limit 20 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,displayTitle,headSha)

          RELEASE_VIEW=$(gh release view 0.1.7 \
            --repo "${{ github.repository }}" \
            --json url,name,tagName,isLatest,publishedAt,assets)

          jq -n \
            --argjson packageRuns "$PACKAGE_RUNS" \
            --argjson release "$RELEASE_VIEW" \
            '{observedAt: now | todateiso8601, packageRuns: $packageRuns, release: $release}' \
            > /tmp/manual-package-status.json

          CONTENT=$(base64 -w0 /tmp/manual-package-status.json)
          CURRENT_SHA=$(gh api \
            "repos/${{ github.repository }}/contents/manual-package-status.json?ref=automation/release-status-0.1.7" \
            --jq '.sha' 2>/dev/null || true)

          if [[ -n "$CURRENT_SHA" ]]; then
            gh api "repos/${{ github.repository }}/contents/manual-package-status.json" \
              --method PUT \
              -f message='Refresh Fresnel 0.1.7 manual package status' \
              -f content="$CONTENT" \
              -f branch='automation/release-status-0.1.7' \
              -f sha="$CURRENT_SHA"
          else
            gh api "repos/${{ github.repository }}/contents/manual-package-status.json" \
              --method PUT \
              -f message='Record Fresnel 0.1.7 manual package status' \
              -f content="$CONTENT" \
              -f branch='automation/release-status-0.1.7'
          fi
