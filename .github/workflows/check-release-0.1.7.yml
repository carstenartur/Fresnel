name: Check Fresnel 0.1.7 release status

on:
  push:
    branches:
      - automation/release-status-0.1.7
    paths:
      - .github/workflows/check-release-0.1.7.yml

permissions:
  actions: read
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Capture and publish latest release workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow deploy-release.yml \
            --branch main \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,displayTitle,headSha)
          CONTENT=$(printf '%s\n' "$STATUS" | base64 -w0)
          gh api "repos/${{ github.repository }}/contents/release-status.json" \
            --method PUT \
            -f message='Record Fresnel 0.1.7 release status' \
            -f content="$CONTENT" \
            -f branch='automation/release-status-0.1.7'
