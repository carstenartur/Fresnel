name: Check Fresnel 0.1.7 release status

on:
  push:
    branches:
      - automation/release-status-0.1.7
    paths:
      - .github/workflows/check-release-0.1.7.yml

permissions:
  actions: read
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Capture release and package status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_RUN=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow deploy-release.yml \
            --branch main \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,displayTitle,headSha)

          PACKAGE_RUN=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow release-package.yml \
            --event release \
            --limit 1 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,displayTitle,headSha)

          RELEASE_VIEW=$(gh release view 0.1.7 \
            --repo "${{ github.repository }}" \
            --json url,name,tagName,isLatest,publishedAt,assets)

          publish_file() {
            local path="$1"
            local message="$2"
            local value="$3"
            local content current_sha
            content=$(printf '%s\n' "$value" | base64 -w0)
            current_sha=$(gh api "repos/${{ github.repository }}/contents/${path}?ref=automation/release-status-0.1.7" --jq '.sha' 2>/dev/null || true)
            if [[ -n "$current_sha" ]]; then
              gh api "repos/${{ github.repository }}/contents/${path}" \
                --method PUT \
                -f message="$message" \
                -f content="$content" \
                -f branch='automation/release-status-0.1.7' \
                -f sha="$current_sha"
            else
              gh api "repos/${{ github.repository }}/contents/${path}" \
                --method PUT \
                -f message="$message" \
                -f content="$content" \
                -f branch='automation/release-status-0.1.7'
            fi
          }

          publish_file release-status.json 'Refresh Fresnel 0.1.7 release status' "$RELEASE_RUN"
          publish_file package-status.json 'Record Fresnel 0.1.7 package workflow status' "$PACKAGE_RUN"
          publish_file release-view.json 'Record Fresnel 0.1.7 release assets' "$RELEASE_VIEW"
