name: Release
run-name: Release ${{ github.run_id }}-${{ github.run_attempt }}

# This workflow validates release metadata, creates the version-only candidate
# commit and dispatches publish-release.yml at that exact commit. Publication and
# attestations therefore run with github.sha equal to the source being released.

on:
  workflow_dispatch:
    inputs:
      next_development_version:
        description: 'Optional exact next version (X.Y.Z-SNAPSHOT); leave empty to use the increment choice'
        required: false
        type: string
        default: ''
      next_version_increment:
        description: 'Select the conventional next version when no exact version is supplied'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Validate and build without pushing a candidate or publishing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fresnel-release-orchestration
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.versions.outputs.release_version }}
      next_snapshot: ${{ steps.versions.outputs.next_snapshot }}
      maintenance_branch: ${{ steps.versions.outputs.maintenance_branch }}
      current_version: ${{ steps.metadata.outputs.current_version }}
      citation_version: ${{ steps.metadata.outputs.citation_version }}
      starting_sha: ${{ steps.baseline.outputs.starting_sha }}
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require current main dispatch
        id: baseline
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "::error::Release workflow must be dispatched from main, not $DISPATCH_REF"
            exit 1
          fi

          LOCAL_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [[ "$LOCAL_SHA" != "$DISPATCH_SHA" || "$REMOTE_SHA" != "$DISPATCH_SHA" ]]; then
            echo "::error::main changed after dispatch (event $DISPATCH_SHA, local $LOCAL_SHA, remote $REMOTE_SHA)"
            exit 1
          fi
          echo "starting_sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Read release metadata
        id: metadata
        run: |
          set -euo pipefail
          CURRENT=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          CITATION_VERSION=$(grep -E '^version:' CITATION.cff | head -1 | sed -E 's/^version:[[:space:]]*"?([^"]*)"?/\1/' || true)
          SUGGESTED=$(grep -E '^next.release.version=' release.properties | head -1 | cut -d'=' -f2 | tr -d '[:space:]' || true)

          echo "current_version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "citation_version=${CITATION_VERSION}" >> "$GITHUB_OUTPUT"
          echo "suggested_release=${SUGGESTED}" >> "$GITHUB_OUTPUT"

      - name: Derive repository-owned version outputs
        id: versions
        env:
          EXACT_NEXT_VERSION: ${{ inputs.next_development_version }}
          NEXT_VERSION_INCREMENT: ${{ inputs.next_version_increment }}
        run: |
          set -euo pipefail
          CURRENT="${{ steps.metadata.outputs.current_version }}"
          SUGGESTED="${{ steps.metadata.outputs.suggested_release }}"

          if ! [[ "$CURRENT" =~ ^[0-9]+[.][0-9]+[.][0-9]+-SNAPSHOT$ ]]; then
            echo "::error::Current project version '$CURRENT' must use X.Y.Z-SNAPSHOT"
            exit 1
          fi
          RELEASE="${CURRENT%-SNAPSHOT}"

          if [[ -z "$SUGGESTED" ]]; then
            echo "::error::release.properties is missing a non-empty next.release.version value"
            exit 1
          fi
          if [[ "$RELEASE" != "$SUGGESTED" ]]; then
            echo "::error::Repository project version derives release $RELEASE, but release.properties contains $SUGGESTED"
            exit 1
          fi

          EXACT_NEXT_VERSION=$(python3 - <<'PY'
          import os
          print(os.environ.get('EXACT_NEXT_VERSION', '').strip())
          PY
          )
          if [[ -n "$EXACT_NEXT_VERSION" ]]; then
            if ! [[ "$EXACT_NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
              echo "::error::next_development_version must use X.Y.Z-SNAPSHOT"
              exit 1
            fi
            NEXT_SNAPSHOT="$EXACT_NEXT_VERSION"
          else
            IFS='.' read -r major minor patch <<< "$RELEASE"
            case "$NEXT_VERSION_INCREMENT" in
              patch) NEXT_SNAPSHOT="${major}.${minor}.$((patch + 1))-SNAPSHOT" ;;
              minor) NEXT_SNAPSHOT="${major}.$((minor + 1)).0-SNAPSHOT" ;;
              major) NEXT_SNAPSHOT="$((major + 1)).0.0-SNAPSHOT" ;;
              *)
                echo "::error::Unsupported next_version_increment '$NEXT_VERSION_INCREMENT'"
                exit 1
                ;;
            esac
          fi

          RELEASE="$RELEASE" NEXT_SNAPSHOT="$NEXT_SNAPSHOT" python3 - <<'PY'
          import os
          release = tuple(map(int, os.environ['RELEASE'].split('.')))
          next_version = tuple(
              map(int, os.environ['NEXT_SNAPSHOT'].removesuffix('-SNAPSHOT').split('.'))
          )
          if next_version <= release:
              raise SystemExit(
                  f"::error::Next development version {os.environ['NEXT_SNAPSHOT']} "
                  f"must be newer than release {os.environ['RELEASE']}"
              )
          PY

          IFS='.' read -r major minor _ <<< "$RELEASE"
          MAINT_BRANCH="maintenance/${major}.${minor}.x"

          echo "release_version=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "next_snapshot=${NEXT_SNAPSHOT}" >> "$GITHUB_OUTPUT"
          echo "maintenance_branch=${MAINT_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Validate project and citation versions
        run: |
          set -euo pipefail
          CURRENT="${{ steps.metadata.outputs.current_version }}"
          CITATION_VERSION="${{ steps.metadata.outputs.citation_version }}"
          if [[ -z "$CITATION_VERSION" || "$CITATION_VERSION" != "$CURRENT" ]]; then
            echo "::error::CITATION.cff version '$CITATION_VERSION' does not match project version '$CURRENT'"
            exit 1
          fi

      - name: Check if release tag already exists
        run: |
          VERSION="${{ steps.versions.outputs.release_version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${VERSION} already exists"
            exit 1
          fi

      - name: Preflight summary
        run: |
          {
            echo "## Preflight Check Summary"
            echo
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Starting main SHA | ${{ steps.baseline.outputs.starting_sha }} |"
            echo "| Current project version | ${{ steps.metadata.outputs.current_version }} |"
            echo "| CITATION.cff version | ${{ steps.metadata.outputs.citation_version }} |"
            echo "| Release version | ${{ steps.versions.outputs.release_version }} |"
            echo "| Next SNAPSHOT | ${{ steps.versions.outputs.next_snapshot }} |"
            echo "| Exact next override | ${{ inputs.next_development_version || '(empty)' }} |"
            echo "| Increment fallback | ${{ inputs.next_version_increment }} |"
            echo "| Maintenance branch | ${{ steps.versions.outputs.maintenance_branch }} |"
            echo "| Dry run | ${{ inputs.dry_run }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  candidate:
    name: Prepare and validate candidate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout validated main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.starting_sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create release metadata commit
        run: |
          set -euo pipefail
          mvn versions:set \
            -DnewVersion=${{ needs.preflight.outputs.release_version }} \
            -DgenerateBackupPoms=false
          python3 .github/scripts/update-citation.py \
            --version "${{ needs.preflight.outputs.release_version }}"
          git add pom.xml backend/pom.xml optics-core/pom.xml CITATION.cff
          git commit -m "Release version ${{ needs.preflight.outputs.release_version }}"

      - name: Validate candidate diff
        id: candidate
        env:
          STARTING_SHA: ${{ needs.preflight.outputs.starting_sha }}
        run: |
          set -euo pipefail
          CANDIDATE_SHA=$(git rev-parse HEAD)
          PARENT_SHA=$(git rev-parse HEAD^)
          if [[ "$PARENT_SHA" != "$STARTING_SHA" ]]; then
            echo "::error::Candidate parent $PARENT_SHA differs from $STARTING_SHA"
            exit 1
          fi

          ACTUAL_FILES=$(git diff --name-only "${STARTING_SHA}..${CANDIDATE_SHA}" | sort)
          EXPECTED_FILES=$(printf '%s\n' \
            CITATION.cff \
            backend/pom.xml \
            optics-core/pom.xml \
            pom.xml | sort)
          if [[ "$ACTUAL_FILES" != "$EXPECTED_FILES" ]]; then
            echo "::error::Release candidate contains changes beyond version metadata"
            diff -u <(printf '%s\n' "$EXPECTED_FILES") <(printf '%s\n' "$ACTUAL_FILES") || true
            exit 1
          fi

          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build and verify candidate with tests
        run: mvn -B -ntp verify

      - name: Revalidate main before dispatch
        env:
          EXPECTED_MAIN_SHA: ${{ needs.preflight.outputs.starting_sha }}
        run: |
          set -euo pipefail
          REMOTE_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [[ "$REMOTE_SHA" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "::error::main moved while candidate was tested (expected $EXPECTED_MAIN_SHA, found $REMOTE_SHA)"
            exit 1
          fi

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Dry run completed"
            echo
            echo "Candidate ${{ steps.candidate.outputs.sha }} was built and tested locally."
            echo "No branch, tag, release, attestation or package was published."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push immutable candidate branch
        if: ${{ !inputs.dry_run }}
        id: branch
        run: |
          set -euo pipefail
          BRANCH_NAME="release/candidate-${{ needs.preflight.outputs.release_version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
          echo "name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Dispatch protected publication workflow
        if: ${{ !inputs.dry_run }}
        id: dispatch
        env:
          VERSION: ${{ needs.preflight.outputs.release_version }}
          STARTING_SHA: ${{ needs.preflight.outputs.starting_sha }}
          NEXT_SNAPSHOT: ${{ needs.preflight.outputs.next_snapshot }}
          MAINTENANCE_BRANCH: ${{ needs.preflight.outputs.maintenance_branch }}
          CANDIDATE_BRANCH: ${{ steps.branch.outputs.name }}
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh workflow run publish-release.yml \
            --repo "${{ github.repository }}" \
            --ref "$CANDIDATE_BRANCH" \
            -f release_version="$VERSION" \
            -f expected_main_sha="$STARTING_SHA" \
            -f candidate_branch="$CANDIDATE_BRANCH" \
            -f next_snapshot="$NEXT_SNAPSHOT" \
            -f maintenance_branch="$MAINTENANCE_BRANCH" \
            -f request_id="$REQUEST_ID"

          EXPECTED_TITLE="Publish Release ${VERSION} ${REQUEST_ID}"
          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow publish-release.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"${EXPECTED_TITLE}\") | .databaseId" \
              | head -1)
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Could not locate dispatched publication workflow '$EXPECTED_TITLE'"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for protected publication
        if: ${{ !inputs.dry_run }}
        run: gh run watch "${{ steps.dispatch.outputs.run_id }}" --repo "${{ github.repository }}" --exit-status

      - name: Publication summary
        if: ${{ !inputs.dry_run }}
        run: |
          {
            echo "## Publication completed"
            echo
            echo "Candidate: ${{ steps.candidate.outputs.sha }}"
            echo "Protected workflow run: ${{ steps.dispatch.outputs.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Candidate recovery summary
        if: ${{ failure() && !inputs.dry_run }}
        run: |
          {
            echo "## Candidate recovery required"
            echo
            echo "The candidate branch may remain for diagnosis."
            echo "Follow docs/release-recovery.md before retrying."
          } >> "$GITHUB_STEP_SUMMARY"
