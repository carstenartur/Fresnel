name: Publish Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version already merged to main (for example 0.1.8)'
        required: true
        type: string
      expected_main_sha:
        description: 'Exact 40-character merge SHA of the reviewed release PR'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ inputs.release_version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Verify and build release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact reviewed release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable main starting point
        env:
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          VERSION: ${{ inputs.release_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::expected_main_sha must be a full lowercase commit SHA"
            exit 1
          }
          [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] || {
            echo "::error::release_version must be X.Y.Z without a prefix"
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$REMOTE_MAIN" != "$EXPECTED_SHA" ]; then
            echo "::error::main moved from $EXPECTED_SHA to $REMOTE_MAIN; review and restart"
            exit 1
          fi

          CURRENT=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          test "$CURRENT" = "$VERSION" || {
            echo "::error::project version '$CURRENT' does not equal '$VERSION'"
            exit 1
          }
          CITATION=$(grep -E '^version:' CITATION.cff | head -1 | sed -E 's/^version:[[:space:]]*"?([^" ]*)"?.*/\1/')
          test "$CITATION" = "$VERSION" || {
            echo "::error::CITATION.cff version '$CITATION' does not equal '$VERSION'"
            exit 1
          }

          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$VERSION\") | [.id, .draft, .target_commitish] | @tsv")
          if [ -n "$EXISTING" ]; then
            IFS=$'\t' read -r RELEASE_ID IS_DRAFT TARGET <<< "$EXISTING"
            test "$IS_DRAFT" = "true" || {
              echo "::error::release $VERSION is already published"
              exit 1
            }
            test "$TARGET" = "$EXPECTED_SHA" || {
              echo "::error::draft release targets $TARGET, expected $EXPECTED_SHA"
              exit 1
            }
            echo "Recovering approved draft release id $RELEASE_ID"
          elif git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION exists without an approved recoverable draft"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run the complete release test suite
        run: mvn -B -ntp verify

      - name: Build distributable archives
        run: mvn -B -ntp -Pfrontend,release-package -pl backend -am package

      - name: Stage and checksum release assets
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          mkdir -p staging
          cp "backend/target/backend-${VERSION}.jar" staging/
          cp backend/target/dist/fresnel-*-windows.zip staging/
          cp backend/target/dist/fresnel-*-linux.tar.gz staging/
          cp CITATION.cff staging/
          if find staging -maxdepth 1 -type f -name '*SNAPSHOT*' | grep -q .; then
            echo "::error::release assets contain SNAPSHOT filenames"
            exit 1
          fi
          (
            cd staging
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          ls -la staging

      - name: Upload validated release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ inputs.release_version }}-${{ inputs.expected_main_sha }}
          path: staging
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish approved release
    needs: build
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout the exact reviewed release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reverify main immediately before publication
        env:
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$REMOTE_MAIN" = "$EXPECTED_SHA" || {
            echo "::error::main moved to $REMOTE_MAIN; nothing was published"
            exit 1
          }

      - name: Download validated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ inputs.release_version }}-${{ inputs.expected_main_sha }}
          path: staging

      - name: Verify downloaded checksums
        run: cd staging && sha256sum -c SHA256SUMS

      - name: Create or recover the exact draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$VERSION\") | [.id, .draft, .target_commitish] | @tsv")
          if [ -z "$EXISTING" ]; then
            gh release create "$VERSION" \
              --draft \
              --target "$EXPECTED_SHA" \
              --title "Fresnel $VERSION" \
              --generate-notes
          else
            IFS=$'\t' read -r RELEASE_ID IS_DRAFT TARGET <<< "$EXISTING"
            test "$IS_DRAFT" = "true"
            test "$TARGET" = "$EXPECTED_SHA"
            echo "Reusing draft release id $RELEASE_ID"
          fi
          gh release upload "$VERSION" staging/* --clobber

      - name: Attest binary release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            staging/*.jar
            staging/*.zip
            staging/*.tar.gz
            staging/SHA256SUMS

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        run: |
          NAME=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push versioned container image
        id: container
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ inputs.release_version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short_sha }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.expected_main_sha }}
            org.opencontainers.image.version=${{ inputs.release_version }}

      - name: Attest container provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Point latest at the attested digest
        run: |
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest" \
            "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}@${{ steps.container.outputs.digest }}"

      - name: Open the next snapshot pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
          BRANCH="post-release/$VERSION"

          if ! git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git checkout -b "$BRANCH" "$EXPECTED_SHA"
            mvn -B -ntp versions:set -DnewVersion="$NEXT" -DgenerateBackupPoms=false
            python3 .github/scripts/update-citation.py --version "$NEXT"
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pom.xml backend/pom.xml optics-core/pom.xml CITATION.cff
            git commit -m "Start $NEXT development"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          if ! gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number' | grep -q .; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Start $NEXT development" \
              --body "Post-release metadata update after Fresnel $VERSION. This PR changes version metadata only and runs the normal required checks."
          fi

      - name: Publish the completed draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
        run: gh release edit "$VERSION" --draft=false --latest

      - name: Publication summary
        run: |
          {
            echo '## Published release'
            echo
            echo "- version: \`${{ inputs.release_version }}\`"
            echo "- source commit: \`${{ inputs.expected_main_sha }}\`"
            echo "- container digest: \`${{ steps.container.outputs.digest }}\`"
            echo '- binary checksums and GitHub artifact attestations: generated'
            echo '- container SBOM, provenance and registry attestation: generated'
          } >> "$GITHUB_STEP_SUMMARY"
