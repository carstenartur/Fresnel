name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (X.Y.Z; must match release.properties)'
        required: true
        type: string
      dry_run:
        description: 'Validate and build without publishing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fresnel-release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.versions.outputs.release_version }}
      next_snapshot: ${{ steps.versions.outputs.next_snapshot }}
      maintenance_branch: ${{ steps.versions.outputs.maintenance_branch }}
      current_version: ${{ steps.metadata.outputs.current_version }}
      citation_version: ${{ steps.metadata.outputs.citation_version }}
      suggested_release: ${{ steps.metadata.outputs.suggested_release }}
      starting_sha: ${{ steps.baseline.outputs.starting_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Capture starting main SHA
        id: baseline
        run: |
          set -euo pipefail
          STARTING_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [[ "$STARTING_SHA" != "$REMOTE_SHA" ]]; then
            echo "::error::Checked-out main $STARTING_SHA differs from origin/main $REMOTE_SHA"
            exit 1
          fi
          echo "starting_sha=$STARTING_SHA" >> "$GITHUB_OUTPUT"

      - name: Read release metadata
        id: metadata
        run: |
          set -euo pipefail
          CURRENT=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          CITATION_VERSION=$(grep -E '^version:' CITATION.cff | head -1 | sed -E 's/^version:[[:space:]]*"?([^"]*)"?/\1/')
          SUGGESTED=$(grep -E '^next.release.version=' release.properties | head -1 | cut -d'=' -f2 | tr -d '[:space:]')

          echo "current_version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "citation_version=${CITATION_VERSION}" >> "$GITHUB_OUTPUT"
          echo "suggested_release=${SUGGESTED}" >> "$GITHUB_OUTPUT"

      - name: Validate release version input
        run: |
          set -euo pipefail
          VERSION="${{ inputs.release_version }}"
          SUGGESTED="${{ steps.metadata.outputs.suggested_release }}"
          if ! [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Invalid release_version '$VERSION' (expected X.Y.Z without prefix)"
            exit 1
          fi
          if [[ -z "$SUGGESTED" || "$VERSION" != "$SUGGESTED" ]]; then
            echo "::error::Release version $VERSION must match release.properties value $SUGGESTED"
            exit 1
          fi

      - name: Calculate version outputs
        id: versions
        run: |
          set -euo pipefail
          RELEASE="${{ inputs.release_version }}"
          IFS='.' read -r major minor patch <<< "$RELEASE"
          NEXT_PATCH=$((patch + 1))
          NEXT_SNAPSHOT="${major}.${minor}.${NEXT_PATCH}-SNAPSHOT"
          MAINT_BRANCH="maintenance/${major}.${minor}.x"

          echo "release_version=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "next_snapshot=${NEXT_SNAPSHOT}" >> "$GITHUB_OUTPUT"
          echo "maintenance_branch=${MAINT_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        run: |
          VERSION="${{ inputs.release_version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${VERSION} already exists"
            exit 1
          fi

      - name: Validate project and citation versions
        run: |
          set -euo pipefail
          CURRENT="${{ steps.metadata.outputs.current_version }}"
          CITATION_VERSION="${{ steps.metadata.outputs.citation_version }}"
          if [[ "$CURRENT" != *-SNAPSHOT ]]; then
            echo "::error::Current project version '$CURRENT' is not a SNAPSHOT"
            exit 1
          fi
          if [[ -z "$CITATION_VERSION" || "$CITATION_VERSION" != "$CURRENT" ]]; then
            echo "::error::CITATION.cff version '$CITATION_VERSION' does not match project version '$CURRENT'"
            exit 1
          fi

      - name: Preflight summary
        run: |
          {
            echo "## Preflight Check Summary"
            echo
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Starting main SHA | ${{ steps.baseline.outputs.starting_sha }} |"
            echo "| Current project version | ${{ steps.metadata.outputs.current_version }} |"
            echo "| CITATION.cff version | ${{ steps.metadata.outputs.citation_version }} |"
            echo "| Release version | ${{ steps.versions.outputs.release_version }} |"
            echo "| Next SNAPSHOT | ${{ steps.versions.outputs.next_snapshot }} |"
            echo "| Maintenance branch | ${{ steps.versions.outputs.maintenance_branch }} |"
            echo "| Dry run | ${{ inputs.dry_run }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build, attest and publish
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout expected main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify expected starting SHA
        env:
          EXPECTED_MAIN_SHA: ${{ needs.preflight.outputs.starting_sha }}
        run: |
          set -euo pipefail
          LOCAL_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [[ "$LOCAL_SHA" != "$EXPECTED_MAIN_SHA" || "$REMOTE_SHA" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "::error::main changed after preflight (expected $EXPECTED_MAIN_SHA, local $LOCAL_SHA, remote $REMOTE_SHA)"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set release version in Maven metadata
        run: mvn versions:set -DnewVersion=${{ needs.preflight.outputs.release_version }} -DgenerateBackupPoms=false

      - name: Set release version in CITATION.cff
        run: python3 .github/scripts/update-citation.py --version "${{ needs.preflight.outputs.release_version }}"

      - name: Commit release version changes
        run: |
          git add pom.xml backend/pom.xml optics-core/pom.xml CITATION.cff
          git commit -m "Release version ${{ needs.preflight.outputs.release_version }}"

      - name: Capture release commit
        id: release_commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build and verify with tests
        run: mvn -B -ntp verify

      - name: Prepare release assets
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.release_version }}"
          mkdir -p dist
          JAR="backend/target/backend-${VERSION}.jar"
          if [[ ! -f "$JAR" ]]; then
            echo "::error::Expected boot jar not found at $JAR"
            ls -la backend/target || true
            exit 1
          fi
          cp "$JAR" "dist/backend-${VERSION}.jar"
          (cd dist && sha256sum "backend-${VERSION}.jar" > "backend-${VERSION}.jar.sha256")

      - name: Push isolated release candidate
        if: ${{ !inputs.dry_run }}
        id: candidate
        run: |
          set -euo pipefail
          TEMP_BRANCH="release/candidate-${{ needs.preflight.outputs.release_version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/${TEMP_BRANCH}"
          echo "branch=$TEMP_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Attest release JAR
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/backend-${{ needs.preflight.outputs.release_version }}.jar

      - name: Set up QEMU
        if: ${{ !inputs.dry_run }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        if: ${{ !inputs.dry_run }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: ${{ !inputs.dry_run }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/carstenartur/fresnel
          tags: |
            type=raw,value=${{ needs.preflight.outputs.release_version }}
            type=raw,value=sha-${{ steps.release_commit.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release_commit.outputs.sha }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.release_version }}

      - name: Build and push versioned Docker image
        if: ${{ !inputs.dry_run }}
        id: container_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest container image
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/carstenartur/fresnel
          subject-digest: ${{ steps.container_build.outputs.digest }}
          push-to-registry: true

      - name: Create annotated tag and draft release
        if: ${{ !inputs.dry_run }}
        id: draft_release
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.release_version }}"
          COMMIT_SHA="${{ steps.release_commit.outputs.sha }}"

          TAG_SHA=$(gh api "repos/${{ github.repository }}/git/tags" \
            --method POST \
            -f tag="$VERSION" \
            -f message="Release version $VERSION" \
            -f object="$COMMIT_SHA" \
            -f type="commit" \
            --jq '.sha')

          gh api "repos/${{ github.repository }}/git/refs" \
            --method POST \
            -f ref="refs/tags/${VERSION}" \
            -f sha="$TAG_SHA"

          gh release create "$VERSION" \
            "dist/backend-${VERSION}.jar" \
            "dist/backend-${VERSION}.jar.sha256" \
            --title "Fresnel ${VERSION}" \
            --generate-notes \
            --verify-tag \
            --draft

          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${VERSION}" --jq '.id')
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Revalidate and fast-forward main
        if: ${{ !inputs.dry_run }}
        env:
          EXPECTED_MAIN_SHA: ${{ needs.preflight.outputs.starting_sha }}
        run: |
          set -euo pipefail
          COMMIT_SHA="${{ steps.release_commit.outputs.sha }}"
          REMOTE_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [[ "$REMOTE_SHA" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "::error::main changed during release (expected $EXPECTED_MAIN_SHA, found $REMOTE_SHA)"
            exit 1
          fi

          gh api "repos/${{ github.repository }}/git/refs/heads/main" \
            --method PATCH \
            -f sha="$COMMIT_SHA" \
            -F force=false

      - name: Promote container image to latest
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="${{ needs.preflight.outputs.release_version }}"
          docker buildx imagetools create \
            --tag ghcr.io/carstenartur/fresnel:latest \
            "ghcr.io/carstenartur/fresnel:${VERSION}"

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          gh api "repos/${{ github.repository }}/releases/${{ steps.draft_release.outputs.release_id }}" \
            --method PATCH \
            -F draft=false

      - name: Update maintenance branch
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          BRANCH_NAME="${{ needs.preflight.outputs.maintenance_branch }}"
          COMMIT_SHA="${{ steps.release_commit.outputs.sha }}"
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            git fetch origin "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
            if ! git merge-base --is-ancestor "refs/remotes/origin/$BRANCH_NAME" "$COMMIT_SHA"; then
              echo "::error::$BRANCH_NAME cannot be fast-forwarded to $COMMIT_SHA"
              exit 1
            fi
            gh api "repos/${{ github.repository }}/git/refs/heads/${BRANCH_NAME}" \
              --method PATCH \
              -f sha="$COMMIT_SHA" \
              -F force=false
          else
            gh api "repos/${{ github.repository }}/git/refs" \
              --method POST \
              -f ref="refs/heads/${BRANCH_NAME}" \
              -f sha="$COMMIT_SHA"
          fi

      - name: Clean up release candidate branch
        if: ${{ success() && !inputs.dry_run }}
        run: git push origin ":refs/heads/${{ steps.candidate.outputs.branch }}"

      - name: Prepare next development iteration
        id: next_iteration
        continue-on-error: true
        run: |
          set -euo pipefail
          RELEASE_COMMIT="${{ steps.release_commit.outputs.sha }}"
          NEXT_VERSION="${{ needs.preflight.outputs.next_snapshot }}"
          NEXT_RELEASE="${NEXT_VERSION%-SNAPSHOT}"
          BRANCH_NAME="release/prepare-next-${NEXT_VERSION}"

          git checkout --detach "$RELEASE_COMMIT"
          git reset --hard "$RELEASE_COMMIT"
          git clean -fd
          mvn versions:set -DnewVersion="$NEXT_VERSION" -DgenerateBackupPoms=false
          python3 .github/scripts/update-citation.py --version "$NEXT_VERSION" --snapshot
          sed -i "s/^next.release.version=.*/next.release.version=${NEXT_RELEASE}/" release.properties

          git checkout -B "$BRANCH_NAME"
          git add pom.xml backend/pom.xml optics-core/pom.xml CITATION.cff release.properties
          git commit -m "Prepare for next development iteration ${NEXT_VERSION}"

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "::notice::Dry run: would push $BRANCH_NAME and open the next-iteration PR"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            git push origin ":refs/heads/${BRANCH_NAME}"
          fi
          git push origin "$BRANCH_NAME"

          cat > /tmp/pr_body.md << EOF
          Automated PR to bump Maven and citation metadata to ${NEXT_VERSION} after release ${{ needs.preflight.outputs.release_version }}.

          ## Changes
          - Bump Maven modules to ${NEXT_VERSION}
          - Update CITATION.cff version to ${NEXT_VERSION}
          - Update release.properties for the next release cycle
          EOF

          gh pr create \
            --title "Prepare for next development iteration ${NEXT_VERSION}" \
            --body-file /tmp/pr_body.md \
            --base main \
            --head "$BRANCH_NAME"

      - name: Report next-iteration PR failure
        if: steps.next_iteration.outcome == 'failure'
        run: |
          echo "::warning::The release was published, but the next-development PR could not be created."
          echo "Create the version-bump PR manually using docs/release-recovery.md." >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run publication summary
        if: ${{ inputs.dry_run }}
        run: |
          VERSION="${{ needs.preflight.outputs.release_version }}"
          {
            echo "## Dry run completed"
            echo
            echo "Validated release $VERSION without changing refs, releases or packages."
            echo "Tests were executed and release assets were built locally."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure recovery summary
        if: ${{ failure() && !inputs.dry_run }}
        run: |
          VERSION="${{ needs.preflight.outputs.release_version }}"
          {
            echo "## Release recovery required"
            echo
            echo "Release $VERSION did not complete."
            echo "Main was protected by the expected-SHA fast-forward gate."
            echo "Inspect any candidate branch, tag, draft release and versioned container image."
            echo "Follow docs/release-recovery.md before retrying."
          } >> "$GITHUB_STEP_SUMMARY"
