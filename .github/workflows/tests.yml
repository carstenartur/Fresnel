name: Tests

# Runs the JUnit / Surefire test suites for every Maven module and renders the
# results as a workflow summary (via dorny/test-reporter). README metric badge
# JSON is generated and published centrally by the Maven Site workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: JUnit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp test 2>&1 | tee maven-test.log

      - name: Verify documentation jobs and checked-in manifest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/docs
          bash packaging/docs-jobs.sh manifest \
            docs/jobs \
            docs/assets/plugins \
            target/docs/example-manifest.json \
            2>&1 | tee docs-job-verification.log
          if ! cmp -s \
              docs/generated/example-manifest.json \
              target/docs/example-manifest.json; then
            echo "The checked-in documentation manifest is stale." >&2
            diff -u \
              docs/generated/example-manifest.json \
              target/docs/example-manifest.json || true
            exit 1
          fi

      - name: Upload generated documentation manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation-example-manifest
          path: target/docs/example-manifest.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-failure-logs
          path: |
            maven-test.log
            docs-job-verification.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish JUnit test report
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: JUnit results
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          retention-days: 14
