name: Tests

# Runs the JUnit / Surefire test suites for every Maven module and renders the
# results as a workflow summary (via dorny/test-reporter). README metric badge
# JSON is generated and published centrally by the Maven Site workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: JUnit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp test 2>&1 | tee maven-test.log

      - name: Upload Maven failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maven-test-log
          path: maven-test.log
          retention-days: 7

      - name: Publish JUnit test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: JUnit results
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          retention-days: 14
