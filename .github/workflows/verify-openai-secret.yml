name: Verify OpenAI Secret

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-openai-secret.yml'

permissions:
  contents: read

jobs:
  verify-openai-secret:
    name: Verify OpenAI speech access
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Verify secret presence
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository Actions secret OPENAI_API_KEY is missing or inaccessible."
            exit 1
          fi
          echo "Repository Actions secret OPENAI_API_KEY is available."

      - name: Verify Speech API access
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          payload = json.dumps({
              "model": "gpt-4o-mini-tts",
              "voice": "cedar",
              "input": "Fresnel narration test.",
              "response_format": "wav",
              "instructions": "Speak naturally and clearly.",
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.openai.com/v1/audio/speech",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['OPENAI_API_KEY']}",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  audio = response.read()
                  content_type = response.headers.get_content_type()
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Speech API rejected the configured key: HTTP {exc.code}: {detail}") from exc
          if len(audio) < 1000:
              raise SystemExit(f"Speech API returned unexpectedly little audio: {len(audio)} bytes")
          print(f"Speech API access verified: {content_type}, {len(audio)} bytes.")
          PY
