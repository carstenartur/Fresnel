name: E2E

# Manual diagnostic entry point only. Pull requests run the identical Maven E2E
# lifecycle as part of the single CI gate in ci.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Maven Playwright E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Reproduce the complete E2E build
        run: mvn -B -ntp -Dfresnel.e2e.skip=false verify

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Maven integration-test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-failsafe-reports
          path: backend/target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7
