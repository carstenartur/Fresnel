name: Release Packages

# Builds the cross-platform distribution artifacts on main, relevant pull
# requests, release publication and manual dispatch. Build jobs are read-only;
# only the protected release-attachment job can write to a GitHub release.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'optics-core/**'
      - 'pom.xml'
      - 'frontend/**'
      - 'packaging/**'
      - 'Dockerfile'
      - '.github/workflows/release-package.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'optics-core/**'
      - 'pom.xml'
      - 'frontend/**'
      - 'packaging/**'
      - 'Dockerfile'
      - '.github/workflows/release-package.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archives:
    name: Build and test jar + ZIP/tar.gz
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build, test and package archives
        run: mvn -B -ntp -Pfrontend,release-package -pl backend -am verify

      - name: Smoke-test bundled SPA
        env:
          FRESNEL_DATA_DIR: ${{ runner.temp }}/fresnel-release-smoke-data
        run: |
          set -euo pipefail
          JAR=$(ls backend/target/backend-*.jar | grep -v '\.original$' | head -1)
          java -jar "$JAR" > bundled-spa-smoke.log 2>&1 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl -sf -u user:user http://127.0.0.1:8080/api/plugins >/dev/null; then
              echo "Packaged application ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              cat bundled-spa-smoke.log
              exit 1
            fi
            sleep 1
          done
          python3 packaging/verify-bundled-spa.py || {
            cat bundled-spa-smoke.log
            exit 1
          }

      - name: Read project version
        id: version
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          mkdir -p staging
          cp backend/target/backend-*.jar staging/
          cp backend/target/dist/fresnel-*-windows.zip staging/
          cp backend/target/dist/fresnel-*-linux.tar.gz staging/
          (
            cd staging
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          ls -la staging

      - name: Upload jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fresnel-jar
          path: |
            staging/backend-*.jar
            staging/SHA256SUMS
          if-no-files-found: error

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fresnel-windows-zip
          path: staging/fresnel-*-windows.zip
          if-no-files-found: error

      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fresnel-linux-tgz
          path: staging/fresnel-*-linux.tar.gz
          if-no-files-found: error

  installers:
    name: jpackage (${{ matrix.os }})
    needs: archives
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            script: bash packaging/jpackage/build-linux.sh
            jpackage_type: deb
            artifact_glob: 'backend/target/dist/*.deb'
          - os: windows-latest
            label: windows
            script: packaging\jpackage\build-windows.cmd
            jpackage_type: msi
            artifact_glob: 'backend/target/dist/*.msi'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Download jar from archives job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fresnel-jar
          path: backend/target

      - name: Build native installer
        env:
          JPACKAGE_TYPE: ${{ matrix.jpackage_type }}
        run: ${{ matrix.script }}

      - name: Upload installer for diagnosis and publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fresnel-installer-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

      - name: Verify Linux installer metadata
        if: matrix.label == 'linux'
        shell: bash
        run: bash packaging/jpackage/verify-linux-package.sh

      - name: Smoke-test Linux desktop runtime
        if: matrix.label == 'linux'
        shell: bash
        run: bash packaging/jpackage/verify-linux-desktop-runtime.sh

      - name: Verify Windows installer metadata
        if: matrix.label == 'windows'
        shell: pwsh
        run: ./packaging/jpackage/verify-windows-package.ps1

  publish-release-assets:
    name: Attach verified packages to published release
    if: github.event_name == 'release'
    needs: [archives, installers]
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    steps:
      - name: Download jar and checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fresnel-jar
          path: release-assets

      - name: Download Windows archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fresnel-windows-zip
          path: release-assets

      - name: Download Linux archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fresnel-linux-tgz
          path: release-assets

      - name: Download Linux installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fresnel-installer-linux
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fresnel-installer-windows
          path: release-assets

      - name: Attach artifacts to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mapfile -d '' FILES < <(find release-assets -type f -print0)
          test ${#FILES[@]} -gt 0
          gh release upload "$TAG" "${FILES[@]}" --clobber
