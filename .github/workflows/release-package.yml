name: Release Packages
run-name: Release Packages ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }} ${{ inputs.request_id }}

# Builds the cross-platform distribution artifacts (jar, Windows ZIP,
# Linux tar.gz, plus native jpackage installers where supported) on
# every push to main, every pull request that touches packaging code,
# on release publication, and on demand via workflow_dispatch.
#
# Build jobs are read-only. A single protected publication job receives narrowly
# scoped write permission only when an existing release tag was explicitly
# resolved and the workflow itself is running at that immutable tag.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'optics-core/**'
      - 'pom.xml'
      - 'packaging/**'
      - '.github/workflows/release-package.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'optics-core/**'
      - 'pom.xml'
      - 'packaging/**'
      - '.github/workflows/release-package.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and attach packages for (optional)'
        required: false
        type: string
        default: ''
      request_id:
        description: 'Optional correlation identifier supplied by release orchestration'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Stage 1: test and build the Spring Boot fat jar + ZIP/tar.gz archives.
  # ──────────────────────────────────────────────────────────────────
  archives:
    name: Test and build jar + ZIP/tar.gz
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.release_target.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Test and build jar + ZIP/tar.gz
        # Activating any explicit Maven profile suppresses activeByDefault profiles.
        # Release packaging therefore names both the frontend and archive profiles.
        run: mvn -B -ntp -Pfrontend,release-package -pl backend -am verify

      - name: Smoke-test bundled SPA
        env:
          FRESNEL_DATA_DIR: ${{ runner.temp }}/fresnel-release-smoke-data
        run: |
          JAR=$(ls backend/target/backend-*.jar | grep -v '\.original$' | head -1)
          java -jar "$JAR" > bundled-spa-smoke.log 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl -sf -u user:user http://127.0.0.1:8080/api/plugins >/dev/null; then
              echo "Packaged application ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              cat bundled-spa-smoke.log
              exit 1
            fi
            sleep 1
          done

          python3 packaging/verify-bundled-spa.py || {
            cat bundled-spa-smoke.log
            exit 1
          }

      - name: Read project version
        id: version
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

      - name: Resolve release attachment target
        id: release_target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          PROJECT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG=""
          if [[ "$EVENT_NAME" == "release" ]]; then
            TAG="$EVENT_TAG"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          fi

          if [[ -n "$TAG" ]]; then
            if ! [[ "$TAG" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
              echo "::error::Release tag '$TAG' must use X.Y.Z"
              exit 1
            fi
            if [[ "$TAG" != "$PROJECT_VERSION" ]]; then
              echo "::error::Release tag '$TAG' does not match project version '$PROJECT_VERSION'"
              exit 1
            fi
            if [[ "$EVENT_REF" != "refs/tags/${TAG}" ]]; then
              echo "::error::Release packages for '$TAG' must run from refs/tags/${TAG}, not $EVENT_REF"
              exit 1
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ -n "$TAG" ]]; then
            echo "Packages will be attached to release $TAG after protected approval"
          else
            echo "Package validation run; no release attachment requested"
          fi

      - name: Stage release artifacts
        run: |
          mkdir -p staging
          cp backend/target/backend-*.jar staging/
          cp backend/target/dist/fresnel-*-windows.zip staging/
          cp backend/target/dist/fresnel-*-linux.tar.gz staging/
          (cd staging && for f in *.jar *.zip *.tar.gz; do sha256sum "$f" > "$f.sha256"; done)
          ls -la staging

      - name: Upload jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fresnel-jar
          path: |
            staging/backend-${{ steps.version.outputs.version }}.jar
            staging/backend-${{ steps.version.outputs.version }}.jar.sha256
          if-no-files-found: error

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fresnel-windows-zip
          path: |
            staging/fresnel-*-windows.zip
            staging/fresnel-*-windows.zip.sha256
          if-no-files-found: error

      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fresnel-linux-tgz
          path: |
            staging/fresnel-*-linux.tar.gz
            staging/fresnel-*-linux.tar.gz.sha256
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # Stage 2: native jpackage installers on matching host systems.
  # ──────────────────────────────────────────────────────────────────
  installers:
    name: jpackage (${{ matrix.os }})
    needs: archives
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            script: bash packaging/jpackage/build-linux.sh
            jpackage_type: deb
            artifact_glob: 'backend/target/dist/*.deb'
          - os: windows-latest
            label: windows
            script: packaging\jpackage\build-windows.cmd
            jpackage_type: msi
            artifact_glob: 'backend/target/dist/*.msi'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Download jar from archives job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fresnel-jar
          path: backend/target

      - name: Build native installer
        env:
          JPACKAGE_TYPE: ${{ matrix.jpackage_type }}
        run: ${{ matrix.script }}

      # Upload before verification so a failing metadata/smoke check still leaves
      # the exact native package available for diagnosis in workflow artifacts.
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fresnel-installer-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

      - name: Verify Linux installer metadata
        if: matrix.label == 'linux'
        shell: bash
        run: bash packaging/jpackage/verify-linux-package.sh

      - name: Smoke-test Linux desktop runtime
        if: matrix.label == 'linux'
        shell: bash
        run: bash packaging/jpackage/verify-linux-desktop-runtime.sh

      - name: Verify Windows installer metadata
        if: matrix.label == 'windows'
        shell: pwsh
        run: ./packaging/jpackage/verify-windows-package.ps1

  publish-packages:
    name: Attach verified platform packages
    needs: [archives, installers]
    if: needs.archives.outputs.release_tag != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Windows ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fresnel-windows-zip
          path: release-assets/windows

      - name: Download Linux tar.gz
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fresnel-linux-tgz
          path: release-assets/linux

      - name: Download verified installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fresnel-installer-*
          path: release-assets/installers
          merge-multiple: true

      - name: Attach files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.archives.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f -print0)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release package files were downloaded"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
