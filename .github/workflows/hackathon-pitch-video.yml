name: Hackathon Pitch Video

# Temporary pull-request trigger for producing and reviewing this subtitle-only
# fallback. Remove it before merge so normal development never renders video.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hackathon-pitch-video.yml'
      - 'frontend/**'
      - 'backend/**'
      - 'optics-core/**'
      - 'docs/assets/plugins/**'
      - 'packaging/docs-jobs.sh'
      - 'scripts/hackathon/**'

permissions:
  contents: read

jobs:
  build-pitch-video:
    name: Build subtitle-only 1080p pitch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-dejavu-core python3-pil

      - name: Build packaged application with frontend
        run: mvn -B -ntp -DskipTests package

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Start packaged application
        env:
          FRESNEL_DATA_DIR: ${{ runner.temp }}/fresnel-pitch-data
        run: |
          JAR=$(ls backend/target/backend-*.jar | grep -v '\.original$' | head -1)
          nohup java -jar "$JAR" > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 60); do
            if curl -sf -u user:user http://127.0.0.1:8080/api/plugins >/dev/null; then
              echo "Fresnel ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Verify packaged SPA assets
        run: python3 packaging/verify-bundled-spa.py

      - name: Capture real UI assets
        working-directory: frontend
        env:
          FRESNEL_PITCH_BASE_URL: http://127.0.0.1:8080
          FRESNEL_PITCH_USER: user
          FRESNEL_PITCH_PASSWORD: user
        run: node scripts/capture-hackathon-assets.mjs

      - name: Build subtitle-only pitch video
        run: |
          set -o pipefail
          {
            python3 scripts/hackathon/build-pitch-video.py
            python3 scripts/hackathon/refine-pitch-captions.py
          } 2>&1 | tee pitch-build.log

      - name: Verify duration, picture and absence of audio
        run: |
          ffprobe -v error \
            -show_entries format=duration:stream=index,codec_type,codec_name,width,height \
            -of json build/hackathon-video/fresnel-pitch.mp4
          test "$(find build/hackathon-video -name 'fresnel-pitch.mp4' -size +100k | wc -l)" -eq 1
          test "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 \
            build/hackathon-video/fresnel-pitch.mp4 | wc -l)" -eq 0

      - name: Stop application
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi

      - name: Upload pitch video package
        uses: actions/upload-artifact@v7
        with:
          name: fresnel-hackathon-pitch-video
          path: |
            build/hackathon-video/fresnel-pitch.mp4
            build/hackathon-video/fresnel-pitch.en.srt
            build/hackathon-video/fresnel-pitch-narration.txt
            build/hackathon-video/fresnel-pitch-manifest.json
            build/hackathon-video/assets/capture-manifest.json
            build/hackathon-video/assets/*.png
            build/hackathon-video/generated/openai-hackathon/*.png
          retention-days: 30
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fresnel-pitch-video-diagnostics
          path: |
            backend.log
            pitch-build.log
            build/hackathon-video/
          retention-days: 7
          if-no-files-found: ignore
