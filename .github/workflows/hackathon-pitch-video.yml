name: Hackathon Pitch Video

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hackathon-pitch-video.yml'
      - 'frontend/**'
      - 'backend/**'
      - 'optics-core/**'
      - 'docs/assets/plugins/**'
      - 'docs/generated/example-manifest.json'
      - 'scripts/hackathon/**'

permissions:
  contents: read

jobs:
  build-pitch-video:
    name: Build narrated 1080p pitch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            espeak-ng ffmpeg fonts-dejavu-core python3-pil

      - name: Build backend
        run: mvn -B -ntp -DskipTests -Pno-frontend package

      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Start backend and Vite UI
        env:
          FRESNEL_DATA_DIR: ${{ runner.temp }}/fresnel-pitch-data
        run: |
          JAR=$(ls backend/target/backend-*.jar | grep -v '\.original$' | head -1)
          nohup java -jar "$JAR" > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 60); do
            if curl -sf -u user:user http://127.0.0.1:8080/api/plugins >/dev/null; then
              echo "Backend ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              cat backend.log
              exit 1
            fi
            sleep 1
          done

          (
            cd frontend
            nohup npm run dev -- --host 127.0.0.1 --strictPort > ../vite.log 2>&1 &
            echo $! > ../vite.pid
          )
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ >/dev/null; then
              echo "Vite UI ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          cat vite.log
          exit 1

      - name: Capture real UI assets
        working-directory: frontend
        env:
          FRESNEL_PITCH_BASE_URL: http://127.0.0.1:5173
          FRESNEL_PITCH_USER: user
          FRESNEL_PITCH_PASSWORD: user
        run: node scripts/capture-hackathon-assets.mjs

      - name: Build narration, captions and video
        run: python3 scripts/hackathon/build-pitch-video.py

      - name: Verify duration and streams
        run: |
          ffprobe -v error \
            -show_entries format=duration:stream=index,codec_type,codec_name,width,height \
            -of json build/hackathon-video/fresnel-pitch.mp4
          test "$(find build/hackathon-video -name 'fresnel-pitch.mp4' -size +100k | wc -l)" -eq 1

      - name: Stop application
        if: always()
        run: |
          if [ -f vite.pid ]; then
            kill "$(cat vite.pid)" || true
          fi
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi

      - name: Upload pitch video package
        uses: actions/upload-artifact@v7
        with:
          name: fresnel-hackathon-pitch-video
          path: |
            build/hackathon-video/fresnel-pitch.mp4
            build/hackathon-video/fresnel-pitch.en.srt
            build/hackathon-video/fresnel-pitch-narration.txt
            build/hackathon-video/fresnel-pitch-manifest.json
            build/hackathon-video/assets/capture-manifest.json
            build/hackathon-video/assets/*.png
          retention-days: 30
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fresnel-pitch-video-diagnostics
          path: |
            backend.log
            vite.log
            build/hackathon-video/
          retention-days: 7
          if-no-files-found: ignore
