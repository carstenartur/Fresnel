name: Hackathon Pitch Video

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hackathon-pitch-video.yml'
      - 'frontend/**'
      - 'backend/**'
      - 'optics-core/**'
      - 'docs/assets/plugins/**'
      - 'docs/generated/example-manifest.json'
      - 'scripts/hackathon/**'

permissions:
  contents: read

jobs:
  build-pitch-video:
    name: Build narrated 1080p pitch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            espeak-ng ffmpeg fonts-dejavu-core python3-pil

      - name: Build packaged application with frontend
        run: mvn -B -ntp -DskipTests package

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Start packaged application
        env:
          FRESNEL_DATA_DIR: ${{ runner.temp }}/fresnel-pitch-data
        run: |
          JAR=$(ls backend/target/backend-*.jar | grep -v '\.original$' | head -1)
          nohup java -jar "$JAR" > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 60); do
            if curl -sf -u user:user http://127.0.0.1:8080/api/plugins >/dev/null; then
              echo "Fresnel ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Verify packaged SPA assets
        run: |
          python3 - <<'PY'
          import base64
          import re
          import urllib.request

          base = "http://127.0.0.1:8080"
          authorization = "Basic " + base64.b64encode(b"user:user").decode("ascii")

          def fetch(path):
              request = urllib.request.Request(
                  base + path,
                  headers={"Authorization": authorization},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.headers.get_content_type(), response.read()

          index_type, index = fetch("/")
          if index_type != "text/html":
              raise SystemExit(f"Expected text/html for index, got {index_type}")

          asset_paths = sorted(set(
              match.decode("utf-8")
              for match in re.findall(rb'/assets/[^"\' ]+\.(?:js|css)', index)
          ))
          if not any(path.endswith(".js") for path in asset_paths):
              raise SystemExit("Bundled index does not reference a JavaScript asset")
          if not any(path.endswith(".css") for path in asset_paths):
              raise SystemExit("Bundled index does not reference a CSS asset")

          for path in asset_paths:
              content_type, body = fetch(path)
              if body.lstrip().lower().startswith((b"<!doctype html", b"<html")):
                  raise SystemExit(f"{path} was incorrectly served as index.html")
              if path.endswith(".js") and content_type not in {
                  "application/javascript", "text/javascript"
              }:
                  raise SystemExit(f"Unexpected JavaScript MIME type for {path}: {content_type}")
              if path.endswith(".css") and content_type != "text/css":
                  raise SystemExit(f"Unexpected CSS MIME type for {path}: {content_type}")
              print(f"verified {path}: {content_type}, {len(body)} bytes")
          PY

      - name: Capture real UI assets
        working-directory: frontend
        env:
          FRESNEL_PITCH_BASE_URL: http://127.0.0.1:8080
          FRESNEL_PITCH_USER: user
          FRESNEL_PITCH_PASSWORD: user
        run: node scripts/capture-hackathon-assets.mjs

      - name: Build narration, captions and video
        run: python3 scripts/hackathon/build-pitch-video.py

      - name: Verify duration and streams
        run: |
          ffprobe -v error \
            -show_entries format=duration:stream=index,codec_type,codec_name,width,height \
            -of json build/hackathon-video/fresnel-pitch.mp4
          test "$(find build/hackathon-video -name 'fresnel-pitch.mp4' -size +100k | wc -l)" -eq 1

      - name: Stop application
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi

      - name: Upload pitch video package
        uses: actions/upload-artifact@v7
        with:
          name: fresnel-hackathon-pitch-video
          path: |
            build/hackathon-video/fresnel-pitch.mp4
            build/hackathon-video/fresnel-pitch.en.srt
            build/hackathon-video/fresnel-pitch-narration.txt
            build/hackathon-video/fresnel-pitch-manifest.json
            build/hackathon-video/assets/capture-manifest.json
            build/hackathon-video/assets/*.png
          retention-days: 30
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fresnel-pitch-video-diagnostics
          path: |
            backend.log
            build/hackathon-video/
          retention-days: 7
          if-no-files-found: ignore
