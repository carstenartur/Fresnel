name: Maven Site

# Build and validate the Maven reports on every pull request. Publication remains
# a separate main-only job with narrowly scoped write permission.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Maven Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, test and generate Maven Site
        run: mvn -B -ntp -Pno-frontend verify site

      - name: Stage and validate reports
        run: python3 packaging/stage-maven-site.py --minimum-coverage 75

      - name: Upload Maven Site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maven-site
          path: site
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Publish Maven Site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Download validated Maven Site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-site
          path: site

      - name: Verify publication artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/qa-summary.json
          test -f site/badges/coverage.json
          test -f site/badges/tests.json

      - name: Deploy Maven Site to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: site
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy Maven site and metric badges'
