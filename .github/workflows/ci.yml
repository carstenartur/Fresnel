name: CI

# Pull requests have one authoritative build gate. The command below is the same
# command developers run locally; GitHub only supplies a clean runner and caches.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify (unit, integration and E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Reproduce the complete project gate
        run: mvn -B -ntp -Dfresnel.e2e.skip=false verify

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maven-failure-reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker build (main only)
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        run: docker build --tag fresnel:ci .
