name: Coverage

# Generates JaCoCo coverage reports for both Maven modules and publishes the
# aggregated HTML plus a Shields-compatible badge JSON to GitHub Pages.
#
# Runs on every push to main, on PRs (report uploaded as artifact only — gh-pages
# is reserved for main), and on a daily schedule to keep the published report
# fresh even when development goes quiet.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: JaCoCo coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & test with coverage
        run: mvn -B -ntp verify -Pno-frontend

      - name: Stage coverage reports, badge and summary for Pages
        run: |
          python3 - <<'PY'
          import csv
          import html
          import json
          import os
          import shutil
          from pathlib import Path

          GREEN, YELLOW = 80.0, 60.0

          def colour(pct: float | None) -> str:
              if pct is None:
                  return "lightgrey"
              if pct >= GREEN:
                  return "brightgreen"
              if pct >= YELLOW:
                  return "yellow"
              return "red"

          def write_json(path: Path, payload: dict) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(payload, separators=(",", ":")) + "\n", encoding="utf-8")

          def esc(value) -> str:
              return html.escape(str(value), quote=True)

          coverage_dir = Path("site/coverage")
          coverage_dir.mkdir(parents=True, exist_ok=True)

          covered = missed = 0
          module_rows = []

          for module in ("optics-core", "backend"):
              report_dir = Path(module) / "target" / "site" / "jacoco"
              target_dir = coverage_dir / module
              if report_dir.is_dir():
                  shutil.copytree(report_dir, target_dir, dirs_exist_ok=True)

              csv_path = report_dir / "jacoco.csv"
              module_covered = module_missed = 0
              if csv_path.is_file():
                  with csv_path.open(newline="", encoding="utf-8") as handle:
                      reader = csv.DictReader(handle)
                      for row in reader:
                          module_covered += int(row.get("INSTRUCTION_COVERED", 0) or 0)
                          module_missed += int(row.get("INSTRUCTION_MISSED", 0) or 0)

              covered += module_covered
              missed += module_missed
              module_total = module_covered + module_missed
              module_pct = (module_covered / module_total * 100.0) if module_total else None
              link = f"{module}/index.html" if (target_dir / "index.html").is_file() else ""
              module_rows.append((module, module_pct, module_covered, module_total, link))

          total = covered + missed
          pct = (covered / total * 100.0) if total else None
          if pct is None:
              raise SystemExit("No JaCoCo CSV coverage data was generated.")
          message = f"{pct:.1f}%" if pct is not None else "no data"

          write_json(coverage_dir / "badge.json", {
              "schemaVersion": 1,
              "label": "coverage",
              "message": message,
              "color": colour(pct),
          })

          rows = []
          for module, module_pct, module_covered, module_total, link in module_rows:
              pct_text = f"{module_pct:.1f}%" if module_pct is not None else "n/a"
              module_text = f'<a href="{esc(link)}">{esc(module)}</a>' if link else esc(module)
              rows.append(
                  "<tr>"
                  f"<td>{module_text}</td>"
                  f"<td>{pct_text}</td>"
                  f"<td>{module_covered}/{module_total}</td>"
                  "</tr>"
              )

          table_rows = "\n".join(rows) or '<tr><td colspan="3">No JaCoCo reports were generated.</td></tr>'
          total_text = message if pct is not None else "No coverage data available."

          (coverage_dir / "index.html").write_text(f'''<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><title>Fresnel Coverage</title>
          <style>body{{font-family:system-ui,sans-serif;margin:2rem;max-width:960px}}table{{border-collapse:collapse;width:100%}}td,th{{border:1px solid #ddd;padding:.5rem;text-align:left}}th{{background:#f6f8fa}}</style>
          </head><body><h1>Fresnel Coverage</h1>
          <p>Total instruction coverage: <strong>{total_text}</strong></p>
          <table><thead><tr><th>Module</th><th>Instruction coverage</th><th>Covered/total instructions</th></tr></thead><tbody>{table_rows}</tbody></table>
          </body></html>\n''', encoding="utf-8")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("### 📊 JaCoCo coverage\n")
                  summary.write(f"- Badge message: **{message}**\n")
                  for module, module_pct, module_covered, module_total, _ in module_rows:
                      pct_text = f"{module_pct:.1f}%" if module_pct is not None else "n/a"
                      summary.write(f"- **{module}**: {pct_text} ({module_covered}/{module_total} instructions)\n")
          PY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: site/coverage
          retention-days: 14

  deploy-coverage:
    name: Deploy coverage report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.coverage.result == 'success'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: jacoco-coverage
          path: site/coverage

      - name: Deploy coverage to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/coverage
          destination_dir: coverage
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy JaCoCo coverage report and badge'
