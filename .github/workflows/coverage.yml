name: Coverage

# Generates JaCoCo coverage reports for both Maven modules and uploads them as
# workflow artifacts. README metric badge JSON is generated and published
# centrally by the Maven Site workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: JaCoCo coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & test with coverage
        run: mvn -B -ntp verify -Pno-frontend

      - name: Coverage summary
        run: |
          python3 - <<'PY'
          import csv
          import os
          from pathlib import Path

          covered = missed = 0
          module_rows = []
          for module in ("optics-core", "backend"):
              csv_path = Path(module) / "target" / "site" / "jacoco" / "jacoco.csv"
              module_covered = module_missed = 0
              if csv_path.is_file():
                  with csv_path.open(newline="", encoding="utf-8") as handle:
                      reader = csv.DictReader(handle)
                      for row in reader:
                          module_covered += int(row.get("INSTRUCTION_COVERED", 0) or 0)
                          module_missed += int(row.get("INSTRUCTION_MISSED", 0) or 0)
              covered += module_covered
              missed += module_missed
              module_total = module_covered + module_missed
              module_pct = (module_covered / module_total * 100.0) if module_total else None
              module_rows.append((module, module_pct, module_covered, module_total))

          total = covered + missed
          pct = (covered / total * 100.0) if total else None
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("### 📊 JaCoCo coverage\n")
                  if pct is None:
                      summary.write("No JaCoCo coverage data found.\n")
                  else:
                      summary.write(f"- **Total**: {pct:.1f}% ({covered}/{total} instructions)\n")
                      for module, module_pct, module_covered, module_total in module_rows:
                          pct_text = f"{module_pct:.1f}%" if module_pct is not None else "n/a"
                          summary.write(f"- **{module}**: {pct_text} ({module_covered}/{module_total} instructions)\n")
          PY

      - name: Stage coverage reports for artifact
        run: |
          mkdir -p site/coverage/optics-core site/coverage/backend
          cp -r optics-core/target/site/jacoco/. site/coverage/optics-core/
          cp -r backend/target/site/jacoco/.     site/coverage/backend/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: site/coverage
          retention-days: 14
