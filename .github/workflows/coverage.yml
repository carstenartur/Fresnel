name: Coverage

# Publishes JaCoCo reports from main and scheduled/manual runs. The coverage
# threshold itself is part of the ordinary Maven verify lifecycle, so pull
# requests do not need a second build workflow.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Publish JaCoCo coverage reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify coverage thresholds
        run: mvn -B -ntp -Pno-frontend verify

      - name: Stage coverage reports for artifact
        if: always()
        run: |
          mkdir -p site/coverage/optics-core site/coverage/backend
          for module in optics-core backend; do
            src="${module}/target/site/jacoco"
            dst="site/coverage/${module}"
            if [ -d "${src}" ]; then
              cp -r "${src}/." "${dst}/"
            else
              echo "::warning::JaCoCo report directory '${src}' not found"
            fi
          done

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-coverage
          path: site/coverage
          if-no-files-found: warn
          retention-days: 14
