name: Complete Release
run-name: Complete Release for run ${{ github.event.workflow_run.id }}

# GitHub suppresses most workflow triggers caused by GITHUB_TOKEN. The Release
# workflow creates the GitHub release with that token, so this workflow_run hook
# explicitly dispatches the cross-platform package workflow and waits for it.
# It also runs after a failed upstream workflow: when publication succeeded but a
# later housekeeping step failed, the already-published release must still receive
# its platform packages. Runs with no published release are safely skipped.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: complete-release-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  packages:
    name: Build and attach cross-platform packages
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release created by the completed run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          set -euo pipefail
          RELEASES=$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 20 \
            --json tagName,publishedAt,isDraft)

          TAG=$(jq -r --arg created "$UPSTREAM_CREATED_AT" '
            [.[] | select(.isDraft == false and .publishedAt >= $created)]
            | sort_by(.publishedAt)
            | last
            | .tagName // empty
          ' <<< "$RELEASES")

          if [[ -z "$TAG" ]]; then
            echo "::notice::No published release was created after $UPSTREAM_CREATED_AT; nothing to complete"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$TAG" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Resolved release tag '$TAG' is not an X.Y.Z release"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Dispatch release packages
        if: steps.release.outputs.skip != 'true'
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REQUEST_ID: release-${{ steps.release.outputs.tag }}-${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh workflow run release-package.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f release_tag="$RELEASE_TAG" \
            -f request_id="$REQUEST_ID"

          EXPECTED_TITLE="Release Packages ${RELEASE_TAG} ${REQUEST_ID}"
          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow release-package.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"${EXPECTED_TITLE}\") | .databaseId" \
              | head -1)
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Could not locate dispatched package workflow '$EXPECTED_TITLE'"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Package workflow run: $RUN_ID"

      - name: Wait for release packages
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch "${{ steps.dispatch.outputs.run_id }}" --repo "${{ github.repository }}" --exit-status
