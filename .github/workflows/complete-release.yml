name: Complete Release
run-name: Complete Release for publication run ${{ github.event.workflow_run.id }}

# GitHub suppresses most workflow triggers caused by GITHUB_TOKEN. Publish
# Release creates the GitHub release with that token, so this workflow_run hook
# explicitly dispatches the cross-platform package workflow and waits for it.
# It also runs after a failed publication workflow: when the release was already
# published but later housekeeping failed, platform packages must still complete.

on:
  workflow_run:
    workflows: [Publish Release]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: complete-release-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  packages:
    name: Build and attach cross-platform packages
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release for the exact publication commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          RELEASES=$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 20 \
            --json tagName,publishedAt,isDraft)

          mapfile -t CANDIDATES < <(jq -r --arg created "$UPSTREAM_CREATED_AT" '
            [.[] | select(.isDraft == false and .publishedAt >= $created)]
            | sort_by(.publishedAt)
            | reverse
            | .[].tagName
          ' <<< "$RELEASES")

          TAG=""
          for CANDIDATE in "${CANDIDATES[@]}"; do
            if ! [[ "$CANDIDATE" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
              continue
            fi

            COMMIT_SHA=$(gh api \
              "repos/${{ github.repository }}/commits/${CANDIDATE}" \
              --jq '.sha')
            if [[ "$COMMIT_SHA" == "$UPSTREAM_HEAD_SHA" ]]; then
              TAG="$CANDIDATE"
              break
            fi
          done

          if [[ -z "$TAG" ]]; then
            echo "::notice::No published release points to publication commit $UPSTREAM_HEAD_SHA; nothing to complete"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Dispatch release packages
        if: steps.release.outputs.skip != 'true'
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REQUEST_ID: release-${{ steps.release.outputs.tag }}-${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh workflow run release-package.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f release_tag="$RELEASE_TAG" \
            -f request_id="$REQUEST_ID"

          EXPECTED_TITLE="Release Packages ${RELEASE_TAG} ${REQUEST_ID}"
          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow release-package.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"${EXPECTED_TITLE}\") | .databaseId" \
              | head -1)
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Could not locate dispatched package workflow '$EXPECTED_TITLE'"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Package workflow run: $RUN_ID"

      - name: Wait for release packages
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch "${{ steps.dispatch.outputs.run_id }}" --repo "${{ github.repository }}" --exit-status
