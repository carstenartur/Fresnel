# Production / staging profile: PostgreSQL and explicit application credentials.
#
# Activate with SPRING_PROFILES_ACTIVE=postgres (or container,postgres inside the
# Docker image). All DB_* and FRESNEL_SECURITY_* secrets are required. HTTP Basic
# must be protected by TLS at the reverse proxy or ingress boundary.
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

fresnel:
  cors:
    allowed-origins: ${FRESNEL_CORS_ALLOWED_ORIGINS:}
  security:
    require-explicit-credentials: true
    user:
      username: ${FRESNEL_SECURITY_USER_USERNAME:user}
      password: ${FRESNEL_SECURITY_USER_PASSWORD:}
    admin:
      username: ${FRESNEL_SECURITY_ADMIN_USERNAME:admin}
      password: ${FRESNEL_SECURITY_ADMIN_PASSWORD:}
